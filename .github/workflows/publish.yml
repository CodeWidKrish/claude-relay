# Publishes the package to PyPI as "claude-relay-antigravity" when a GitHub release is published.
# It uses PyPI trusted publishing (no API token is stored anywhere). It stays switched off until
# the repository variable PYPI_PUBLISH is set to "true"; CONTRIBUTING.md explains the one-time setup.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/claude-relay-antigravity/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check that the release tag matches the version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import relay; print(relay.VERSION)")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} does not match v${version}"; exit 1; }
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
