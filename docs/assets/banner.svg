<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Claude Relay: Claude Code and Google Antigravity, one workflow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.55" stop-color="#2b2560"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a5a"/>
      <stop offset="0.5" stop-color="#f6c177"/>
      <stop offset="1" stop-color="#7aa8ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0;0.3 0;-0.3 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a4c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a4c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <style>
      .t  { font: 800 70px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; }
      .s  { font: 400 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #d4d2f0; }
      .n  { font: 700 20px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .m  { font: 600 14px Consolas, Menlo, 'DejaVu Sans Mono', monospace; fill: #e9e6ff; }



      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse2 { animation: pulse 2.4s 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { transform: scale(0.85); opacity: .65; } 50% { transform: scale(1.12); opacity: 1; } }
      .dash { stroke-dasharray: 6 10; animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -32; } }
      .float { animation: float 3s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    </style>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#dots)"/>

  <g>
    <text x="600" y="112" text-anchor="middle" class="t" fill="url(#title)">Claude Relay</text>
  </g>
  <g>
    <text x="600" y="156" text-anchor="middle" class="s">Use Google Antigravity inside Claude Code, and keep coding past the 5-hour limit</text>
  </g>

  <g>
    <!-- connection -->
    <path id="link" d="M 395 258 C 520 205, 680 205, 805 258" fill="none" stroke="#8f8be0" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M 395 258 C 520 205, 680 205, 805 258" fill="none" stroke="#c7c3ff" stroke-width="3" class="dash"/>
    <circle r="9" fill="#ffd28a" filter="url(#soft)">
      <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;1;1;0;0" keyTimes="0;0.4;0.5;0.9;1" calcMode="linear">
        <mpath href="#link"/>
      </animateMotion>
    </circle>
    <circle r="5" fill="#fff4dc">
      <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;1;1;0;0" keyTimes="0;0.4;0.5;0.9;1" calcMode="linear">
        <mpath href="#link"/>
      </animateMotion>
    </circle>

    <!-- handoff doc -->
    <g class="float">
      <rect x="548" y="190" width="104" height="30" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#c7c3ff" stroke-opacity="0.6"/>
      <text x="600" y="210" text-anchor="middle" class="m">HANDOFF.md</text>
    </g>

    <!-- left node -->
    <circle cx="300" cy="262" r="78" fill="url(#glowL)" class="pulse"/>
    <rect x="200" y="236" width="200" height="54" rx="27" fill="#d9773f"/>
    <rect x="200" y="236" width="200" height="54" rx="27" fill="none" stroke="#ffd0ae" stroke-opacity="0.7"/>
    <text x="300" y="270" text-anchor="middle" class="n">Claude Code</text>

    <!-- right node -->
    <circle cx="900" cy="262" r="78" fill="url(#glowR)" class="pulse2"/>
    <rect x="800" y="236" width="200" height="54" rx="27" fill="#3f6fe0"/>
    <rect x="800" y="236" width="200" height="54" rx="27" fill="none" stroke="#bcd0ff" stroke-opacity="0.7"/>
    <text x="900" y="270" text-anchor="middle" class="n">Antigravity</text>
  </g>
</svg>
