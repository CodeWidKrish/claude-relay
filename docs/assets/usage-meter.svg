<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" role="img" aria-label="Animated demo: 5-hour usage rises, handoff is prepared at 90 percent, and work switches to Antigravity at 100 percent">
  <style>
    .mono { font-family: Consolas, Menlo, 'DejaVu Sans Mono', 'Courier New', monospace; }
    .lbl  { font-size: 15px; fill: #9aa4b2; }
    .hd   { font-size: 15px; fill: #e6edf3; font-weight: 700; }
    .st   { font-size: 17px; font-weight: 700; }
  </style>
  <rect width="860" height="150" rx="14" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="859" height="149" rx="14" fill="none" stroke="#30363d"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/><circle cx="44" cy="22" r="6" fill="#febc2e"/><circle cx="64" cy="22" r="6" fill="#28c840"/>
  <text x="430" y="27" text-anchor="middle" class="mono lbl">claude code · status line</text>

  <text x="28" y="74" class="mono hd">5h</text>
  <rect x="64" y="58" width="600" height="22" rx="11" fill="#21262d"/>
  <rect x="64" y="58" width="0" height="22" rx="11" fill="#3fb950">
    <animate attributeName="width" values="0;480;540;600;600;0" keyTimes="0;0.4;0.55;0.7;0.95;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#3fb950;#3fb950;#d29922;#f85149;#f85149;#3fb950" keyTimes="0;0.36;0.42;0.53;0.95;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <!-- threshold ticks -->
  <line x1="544" y1="52" x2="544" y2="86" stroke="#d29922" stroke-dasharray="3 3"/>
  <line x1="604" y1="52" x2="604" y2="86" stroke="#f85149" stroke-dasharray="3 3"/>
  <text x="544" y="102" text-anchor="middle" class="mono lbl">80%</text>
  <text x="604" y="102" text-anchor="middle" class="mono lbl">90%</text>
  <text x="664" y="102" text-anchor="middle" class="mono lbl">100%</text>

  <!-- stage labels, one visible at a time -->
  <g class="mono st">
    <text x="690" y="75" fill="#3fb950" opacity="0">watching<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.38;0.4;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="690" y="75" fill="#d29922" opacity="0">warning<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.41;0.53;0.55;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="690" y="75" fill="#f85149" opacity="0">preparing…<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.56;0.69;0.7;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="690" y="75" fill="#f85149" opacity="0">limit hit!<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7;0.71;0.76;0.77;1" dur="10s" repeatCount="indefinite"/></text>
  </g>

  <!-- switch banner -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.76;0.79;0.93;0.96;1" dur="10s" repeatCount="indefinite"/>
    <rect x="200" y="112" width="460" height="28" rx="14" fill="#1f3b8a"/>
    <text x="430" y="131" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#cfe0ff">⚡ HANDOFF.md ready → opening Antigravity</text>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.74;0.76;0.96;1" dur="10s" repeatCount="indefinite"/>
    <text x="430" y="131" text-anchor="middle" class="mono lbl">yellow at 80% · handoff prepared at 90% · switch at 100%</text>
  </g>
</svg>
