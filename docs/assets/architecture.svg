<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Claude Relay architecture: Claude Code sends usage to relay.py, which writes a redacted checkpoint and opens Antigravity; Antigravity's commits and notes come back to Claude Code with back --launch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.55" stop-color="#211d4d"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="relay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a5a"/>
      <stop offset="1" stop-color="#7aa8ff"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .h   { font: 800 30px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .sub { font: 400 16px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #b9b6e3; }
      .ct  { font: 700 21px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .cl  { font: 500 14px Consolas, Menlo, 'DejaVu Sans Mono', monospace; fill: #d9d6ff; }
      .lb  { font: 600 13px Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
      .st  { font: 600 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #e9e6ff; }
      .num { font: 800 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #0f0c29; }
      .flow { stroke-dasharray: 7 9; animation: flow 1.1s linear infinite; }
      .back { stroke-dasharray: 7 9; animation: flow 1.1s linear infinite reverse; }
      @keyframes flow { to { stroke-dashoffset: -32; } }
      .breathe { animation: breathe 3s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { stroke-opacity: .55; } 50% { stroke-opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="500" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="500" rx="22" fill="url(#dots)"/>
  <text x="600" y="52" text-anchor="middle" class="h">How Claude Relay moves your work</text>
  <text x="600" y="80" text-anchor="middle" class="sub">One checkpoint file carries the task out to Antigravity and brings the progress back</text>

  <!-- Claude Code -->
  <rect x="50" y="135" width="280" height="190" rx="18" fill="#1d1a3f" stroke="#ff8a4c" stroke-width="2" class="breathe"/>
  <circle cx="84" cy="170" r="9" fill="#ff8a4c" filter="url(#glow)"/>
  <text x="104" y="177" class="ct">Claude Code</text>
  <text x="74" y="215" class="cl">status line · 5h usage</text>
  <text x="74" y="243" class="cl">StopFailure: rate_limit</text>
  <text x="74" y="271" class="cl">/handoff</text>
  <text x="74" y="299" class="cl">/ask-antigravity</text>

  <!-- relay.py -->
  <rect x="460" y="112" width="280" height="236" rx="18" fill="#221d4a" stroke="url(#relay)" stroke-width="2.5"/>
  <circle cx="494" cy="147" r="9" fill="url(#relay)" filter="url(#glow)"/>
  <text x="514" y="154" class="ct">relay.py</text>
  <text x="484" y="192" class="cl">checkpoint at 90%</text>
  <text x="484" y="220" class="cl">secrets → [REDACTED]</text>
  <text x="484" y="248" class="cl">diff + git commit</text>
  <text x="484" y="276" class="cl">.relay/  (git-ignored)</text>
  <text x="484" y="304" class="cl">files attached to ask</text>
  <text x="484" y="332" class="cl">15 min launch cooldown</text>

  <!-- Antigravity -->
  <rect x="870" y="135" width="280" height="190" rx="18" fill="#1a2146" stroke="#5b8cff" stroke-width="2" class="breathe"/>
  <circle cx="904" cy="170" r="9" fill="#5b8cff" filter="url(#glow)"/>
  <text x="924" y="177" class="ct">Antigravity CLI</text>
  <text x="894" y="215" class="cl">agy -i  (continue task)</text>
  <text x="894" y="243" class="cl">agy -p  (answer a question)</text>
  <text x="894" y="271" class="cl">plan mode by default</text>
  <text x="894" y="299" class="cl">notes → Progress section</text>

  <!-- forward flows -->
  <path id="p1" d="M330 195 L460 195" stroke="#ff8a4c" stroke-width="3" fill="none" class="flow"/>
  <path id="p2" d="M740 195 L870 195" stroke="#a78bfa" stroke-width="3" fill="none" class="flow"/>
  <text x="395" y="183" text-anchor="middle" class="lb" fill="#ffb98a">usage %</text>
  <text x="805" y="183" text-anchor="middle" class="lb" fill="#c9b8ff">HANDOFF.md</text>
  <circle r="6" fill="#ffd2b0" filter="url(#glow)"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <circle r="6" fill="#ddd2ff" filter="url(#glow)"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>

  <!-- return flows -->
  <path id="p3" d="M870 270 L740 270" stroke="#5b8cff" stroke-width="3" fill="none" class="flow"/>
  <path id="p4" d="M460 270 L330 270" stroke="#7aa8ff" stroke-width="3" fill="none" class="flow"/>
  <text x="805" y="295" text-anchor="middle" class="lb" fill="#a9c2ff">commits · notes</text>
  <text x="395" y="295" text-anchor="middle" class="lb" fill="#a9c2ff">back --launch</text>
  <circle r="6" fill="#cfe0ff" filter="url(#glow)"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  <circle r="6" fill="#cfe0ff" filter="url(#glow)"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>

  <!-- timeline: one step lights up at a time (12 s loop) -->
  <line x1="150" y1="425" x2="1050" y2="425" stroke="#3b3670" stroke-width="3"/>
  <g>
    <rect x="70" y="400" width="250" height="50" rx="25" fill="#ff8a4c" fill-opacity="0.18" stroke="#ff8a4c">
      <animate attributeName="fill-opacity" values="0.55;0.55;0.12;0.12" keyTimes="0;0.24;0.25;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <circle cx="98" cy="425" r="13" fill="#ff8a4c"/><text x="98" y="430" text-anchor="middle" class="num">1</text>
    <text x="120" y="430" class="st">Usage climbs past 90%</text>
  </g>
  <g>
    <rect x="345" y="400" width="250" height="50" rx="25" fill="#c084fc" fill-opacity="0.12" stroke="#c084fc">
      <animate attributeName="fill-opacity" values="0.12;0.12;0.55;0.55;0.12;0.12" keyTimes="0;0.25;0.26;0.49;0.5;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <circle cx="373" cy="425" r="13" fill="#c084fc"/><text x="373" y="430" text-anchor="middle" class="num">2</text>
    <text x="395" y="430" class="st">Checkpoint written early</text>
  </g>
  <g>
    <rect x="620" y="400" width="250" height="50" rx="25" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8">
      <animate attributeName="fill-opacity" values="0.12;0.12;0.55;0.55;0.12;0.12" keyTimes="0;0.5;0.51;0.74;0.75;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <circle cx="648" cy="425" r="13" fill="#818cf8"/><text x="648" y="430" text-anchor="middle" class="num">3</text>
    <text x="670" y="430" class="st">Limit hit: Antigravity opens</text>
  </g>
  <g>
    <rect x="895" y="400" width="250" height="50" rx="25" fill="#5b8cff" fill-opacity="0.12" stroke="#5b8cff">
      <animate attributeName="fill-opacity" values="0.12;0.12;0.55;0.55" keyTimes="0;0.75;0.76;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <circle cx="923" cy="425" r="13" fill="#5b8cff"/><text x="923" y="430" text-anchor="middle" class="num">4</text>
    <text x="945" y="430" class="st">Reset: back to Claude</text>
  </g>
</svg>
